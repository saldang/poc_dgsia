version: "3.8"

services:
  ollama:
    build: ./ollama
    container_name: ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - rag_network

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/app/db
    networks:
      - rag_network

  frontend:
    build: ./frontend
    container_name: rag_frontend
    depends_on:
      - backend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
    networks:
      - rag_network

  backend:
    build: ./backend
    container_name: rag_backend
    restart: always
    depends_on:
      - ollama
      - chromadb

    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  ollama_data:
  chromadb_data:
